<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>바카라산악회 실시간 슬롯경매</title>
<style>
:root{--bg:#060608;--panel:#111116;--line:rgba(255,255,255,.09);--gold:#f4d37e;--hot:#ff5d7d;--green:#66e7a8;--muted:#8c8c95}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,rgba(244,211,126,.08),transparent 32%),#060608;color:#fff;font-family:Arial,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}
button,input{font:inherit}.screen{display:none;min-height:100vh}.screen.show{display:block}
.intro{display:grid;place-items:center;padding:20px}.intro-card{width:min(94vw,520px);padding:28px;border:1px solid var(--line);border-radius:26px;background:#111116;text-align:center;box-shadow:0 30px 100px rgba(0,0,0,.55)}
.intro h1{margin:0;font-size:38px}.intro h2{margin:3px 0 20px;color:var(--gold);font-size:22px}.live{display:inline-flex;gap:7px;align-items:center;padding:7px 10px;border-radius:999px;background:#2b1117;color:#ffc0cf;font-size:10px;font-weight:1000}.live i{width:7px;height:7px;border-radius:50%;background:#ff436c;box-shadow:0 0 10px #ff436c}
.intro input{width:100%;height:52px;border-radius:13px;border:1px solid var(--line);background:#09090c;color:#fff;padding:0 14px;font-size:16px;font-weight:900}.join{width:100%;height:54px;margin-top:10px;border:0;border-radius:13px;background:linear-gradient(135deg,#f7df95,#b97f2b);font-weight:1000}
.err{min-height:20px;color:#ff7898;font-size:11px;margin-top:8px}
.auction{padding:10px}.wrap{width:min(1450px,100%);margin:auto}.top{position:relative;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:17px;background:#101015}
.brand b{display:block;font-size:19px}.brand span{font-size:9px;color:#a68b53;letter-spacing:.15em}.admin-open{position:absolute;left:50%;transform:translateX(-50%);height:36px;padding:0 18px;border-radius:999px;border:1px solid rgba(244,211,126,.25);background:#21190c;color:#ffe4a0;font-size:10px;font-weight:1000;letter-spacing:.14em}
.me{text-align:right;font-size:10px;color:#888}.me b{display:block;color:#fff;font-size:13px}.balance{color:var(--gold)!important}
.grid{display:grid;grid-template-columns:250px minmax(0,1fr) 280px;gap:10px;margin-top:10px}.panel{border:1px solid var(--line);border-radius:18px;background:#101015;overflow:hidden}.hd{padding:12px 14px;border-bottom:1px solid var(--line);font-size:12px;font-weight:1000;color:#eadcb5}
.members,.logs{padding:9px;max-height:620px;overflow:auto}.member,.log{padding:9px;border-radius:11px;background:#0b0b0f;margin-bottom:6px;border:1px solid rgba(255,255,255,.05)}.member{display:flex;justify-content:space-between}.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.empty{text-align:center;color:#777;font-size:11px;padding:24px 8px}
.center{padding:12px}.hero{padding:18px;border-radius:18px;border:1px solid rgba(244,211,126,.15);background:radial-gradient(circle at 50% 0,rgba(244,211,126,.10),transparent 45%),linear-gradient(145deg,#1a1510,#0a0a0c)}
.kicker{font-size:9px;color:#a98d55;font-weight:1000;letter-spacing:.17em}.title{font-size:34px;font-weight:1000;margin-top:7px;text-align:center}.status{text-align:center;margin-top:10px;color:#aaa;font-size:11px}.status b{color:#bff8d8}
.price-label{text-align:center;margin-top:18px;color:#777;font-size:9px;font-weight:900;letter-spacing:.14em}.price{text-align:center;font-size:58px;font-weight:1000;color:#ffecae}.leader{text-align:center;color:#aaa;font-size:11px}.leader b{color:#fff}
.bidbox{margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:15px;background:#0b0b0f}.bidtitle{text-align:center;font-size:11px;color:#d9c493;font-weight:1000;margin-bottom:8px}.bids{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.bid{height:50px;border-radius:12px;border:1px solid rgba(244,211,126,.12);background:#18181e;color:#fff;font-weight:1000}.bid.hot{background:#39141f}.bid.gold{background:#30240c;color:#ffe5a0}.bid:disabled{opacity:.35}
.notice{text-align:center;color:#777;font-size:10px;margin-top:8px}
.off-overlay{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.88);z-index:50;padding:18px}.off-overlay.show{display:grid}.off-card{text-align:center}.off-card h2{font-size:34px;color:#ffdf91}.off-card p{color:#aaa}
@media(max-width:900px){.grid{grid-template-columns:1fr}.members,.logs{max-height:220px}.admin-open{position:static;transform:none}.top{flex-wrap:wrap}.bids{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<section class="screen intro show" id="intro">
 <div class="intro-card">
  <div class="live"><i></i> LIVE AUCTION</div>
  <h1>바카라산악회</h1><h2>실시간 슬롯경매</h2>
  <input id="nickname" maxlength="20" placeholder="닉네임을 입력하세요">
  <button class="join" id="joinBtn">경매 참가</button>
  <div class="err" id="err"></div>
 </div>
</section>

<section class="screen auction" id="auction">
 <div class="wrap">
  <div class="top">
   <div class="brand"><b>바카라산악회 슬롯경매</b><span>PREMIUM LIVE AUCTION</span></div>
   <button class="admin-open" id="adminOpen">ADMIN</button>
   <div class="me">참가자 <b id="myName">-</b>보유금 <b class="balance" id="myBalance">0원</b></div>
  </div>

  <div class="grid">
   <aside class="panel"><div class="hd">🟢 실시간 참여자 <span id="count">0</span>명</div><div class="members" id="members"></div></aside>
   <main class="panel"><div class="center">
    <div class="hero">
     <div class="kicker">TODAY'S FEATURED SLOT</div>
     <div class="title" id="title">오늘의 메인 슬롯</div>
     <div class="status">상태 · <b id="status">경매 준비중</b></div>
     <div class="price-label">CURRENT HIGHEST BID</div>
     <div class="price" id="price">0원</div>
     <div class="leader">최고 입찰자 · <b id="leader">없음</b></div>
    </div>
    <div class="bidbox">
     <div class="bidtitle">◆ 입찰 금액 올리기 ◆</div>
     <div class="bids">
      <button class="bid" data-inc="5000">+5천</button>
      <button class="bid" data-inc="10000">+1만</button>
      <button class="bid" data-inc="20000">+2만</button>
      <button class="bid hot" data-inc="30000">+3만</button>
      <button class="bid hot" data-inc="50000">+5만</button>
      <button class="bid gold" data-inc="100000">+10만</button>
     </div>
     <div class="notice" id="notice">방장이 경매를 시작하면 입찰할 수 있습니다.</div>
    </div>
   </div></main>
   <aside class="panel"><div class="hd">⚡ 실시간 입찰</div><div class="logs" id="logs"></div></aside>
  </div>
 </div>
</section>

<div class="off-overlay" id="offOverlay"><div class="off-card"><h2>경매 OFF</h2><p>경매방이 초기화되었습니다.<br>다시 참가하려면 닉네임을 입력해주세요.</p></div></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket=io();
let me=null, participants=[], state={title:'오늘의 메인 슬롯',currentPrice:0,leader:null,status:'ready',logs:[]};
const $=id=>document.getElementById(id); const money=n=>Number(n||0).toLocaleString('ko-KR')+'원';
function statusText(s){return s==='live'?'경매 진행중':s==='ended'?'경매 종료':s==='sold'?'낙찰 완료':'경매 준비중'}
function render(){
 $('title').textContent=state.title||'오늘의 메인 슬롯'; $('price').textContent=money(state.currentPrice||0);
 $('leader').textContent=state.leader||'없음'; $('status').textContent=statusText(state.status);
 const mine=participants.find(p=>p.name===me); $('myBalance').textContent=money(mine?.balance||0);
 $('count').textContent=participants.length;
 $('members').innerHTML=participants.length?participants.map(p=>`<div class="member"><b>${p.name}${p.name===me?' (나)':''}</b><span class="dot"></span></div>`).join(''):'<div class="empty">현재 접속자가 없습니다.</div>';
 $('logs').innerHTML=(state.logs||[]).length?(state.logs||[]).map(x=>`<div class="log"><b>${x.name}</b><div style="color:#f4d37e;margin-top:4px">+${money(x.inc)} → ${money(x.total)}</div></div>`).join(''):'<div class="empty">입찰 기록이 없습니다.</div>';
 const live=state.status==='live'; document.querySelectorAll('.bid').forEach(b=>b.disabled=!live);
 $('notice').textContent=live?'입찰 가능합니다.':'방장이 경매를 시작하면 입찰할 수 있습니다.';
}
$('joinBtn').onclick=()=>{const name=$('nickname').value.trim();if(!name){$('err').textContent='닉네임을 입력해주세요.';return}
 socket.emit('join_auction',{name},res=>{if(!res?.ok){$('err').textContent=res?.message||'접속 실패';return}me=res.name;$('myName').textContent=me;$('intro').classList.remove('show');$('auction').classList.add('show');render()})};
$('nickname').addEventListener('keydown',e=>{if(e.key==='Enter')$('joinBtn').click()});
$('adminOpen').onclick=()=>window.open('/admin.html','sanakAdmin','width=1100,height=820,noopener,noreferrer');
document.querySelectorAll('.bid').forEach(btn=>btn.onclick=()=>socket.emit('place_bid',{inc:Number(btn.dataset.inc)},res=>{if(!res?.ok)alert(res?.message||'입찰 실패')}));
socket.on('participants',list=>{participants=Array.isArray(list)?list:[];render()});
socket.on('auction_state',s=>{state=s||state;render()});
socket.on('auction_off',()=>{me=null;participants=[];$('auction').classList.remove('show');$('intro').classList.add('show');$('nickname').value='';$('err').textContent='';$('offOverlay').classList.add('show');setTimeout(()=>$('offOverlay').classList.remove('show'),2200)});
render();
</script>
</body></html>
